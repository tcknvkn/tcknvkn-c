name: CI

on:
  push:
    branches:
      - release
      - development
    tags:
      - "v*"
  pull_request:
    branches:
      - release
      - development

permissions:
  contents: write
  deployments: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build --output-on-failure

  verify-tag-on-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on release branch
        run: |
          git fetch origin release --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release"

  deploy-beta:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta')
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: c-beta

    steps:
      - uses: actions/checkout@v4

      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build --output-on-failure
      - run: tar -czf tcknvkn-c-${{ github.ref_name }}.tar.gz src tests examples CMakeLists.txt README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-c-${{ github.ref_name }}
          path: tcknvkn-c-${{ github.ref_name }}.tar.gz

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body: |
            C için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi beta sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/c
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #c #tcknvkn #tcuret #vknuret

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta')
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: c-production

    steps:
      - uses: actions/checkout@v4

      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build --output-on-failure
      - run: tar -czf tcknvkn-c-${{ github.ref_name }}.tar.gz src tests examples CMakeLists.txt README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-c-${{ github.ref_name }}
          path: tcknvkn-c-${{ github.ref_name }}.tar.gz

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            C için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi kararlı sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/nodejs
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #c #tcknvkn #tcuret #vknuret

  # Golden dataset tcknvkn/spec reposundan kopyalanmistir; ELLE DUZENLENMEZ.
  # Kopyalanan dosya zamanla sessizce ayrisir - biri duzeltilir, on sekizi eski
  # kalir. Bu kapi farki merge aninda yakalar.
  #
  # Dataset guncellendiginde: once tcknvkn/spec reposunda yeni surum etiketlenir,
  # sonra buradaki dosya ve asagidaki hash birlikte guncellenir.
  golden-dataset:
    runs-on: ubuntu-latest
    env:
      # tcknvkn/spec @ spec-v1.0.0
      GOLDEN_SHA256: e472cca15d825160877053da1e6e7078e8c1c18ef32fa25f5abb100bef217df9
    steps:
      - uses: actions/checkout@v4

      - name: Kopya kanonik surumle ayni mi
        run: |
          if ! echo "${GOLDEN_SHA256}  tests/golden-dataset.json" | sha256sum -c - ; then
            echo "::error::tests/golden-dataset.json kanonik surumden farkli."
            echo "beklenen: ${GOLDEN_SHA256}"
            echo "bulunan : $(sha256sum tests/golden-dataset.json | awk '{print $1}')"
            echo "kanonik kaynak: https://github.com/tcknvkn/spec (spec-v1.0.0)"
            exit 1
          fi
